<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexaTalk AI - Novo Atendimento</title>

  <!-- Bootstrap 5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

  <div class="celular">

    <!-- Cabeçalho com botão voltar -->
    <div class="cabecalho">
      <a class="voltar" href="../index.html"><i class="bi bi-arrow-left"></i></a>
      <span class="titulo-topo">Novo Atendimento</span>
    </div>

    <div class="corpo">

      <span class="etiqueta-passo">PASSO 2</span>

      <!-- Formulário de abertura -->
      <form id="formAtendimento" novalidate>

        <div class="mb-3">
          <label class="form-label" for="nome">Nome</label>
          <input type="text" class="form-control" id="nome" placeholder="Ex: João Silva" required>
          <div class="invalid-feedback">Por favor, informe seu nome.</div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="contato">E-mail ou Telefone</label>
          <input type="text" class="form-control" id="contato" placeholder="Ex: joao@email.com" required>
          <div class="invalid-feedback">Por favor, informe um e-mail ou telefone.</div>
        </div>

        <div class="mb-2">
          <label class="form-label" for="descricao">O que você precisa resolver?</label>
          <textarea class="form-control" id="descricao" rows="5" maxlength="500"
            placeholder="Descreva sua necessidade com suas próprias palavras..." required></textarea>
          <div class="invalid-feedback">Por favor, descreva o que você precisa.</div>
          <div class="text-end text-secondary mt-1" style="font-size: 0.8rem;">
            <span id="contador">0</span>/500
          </div>
        </div>

        <button type="button" id="btnVoz" class="btn-gravar" onclick="gravarDescricao()">
          <i class="bi bi-mic me-2"></i> Falar o problema (voz)
        </button>
        <div class="acoes-texto mb-2">
          <button type="button" class="btn-roxo-claro" onclick="reescreverDescricao('simples')">Simplificar linguagem</button>
          <button type="button" class="btn-roxo-claro" onclick="reescreverDescricao('es')">Traducir al español</button>
        </div>

        <!-- Melhorar texto com a IA (sob demanda) -->
        <button type="button" id="btnMelhorar" class="btn-roxo-claro" style="padding: 11px; font-size: 0.92rem;" onclick="melhorarDescricao()">
          <i class="bi bi-magic me-2"></i> Melhorar descrição com IA
        </button>
        <div id="msgMelhorar" class="text-center text-secondary mt-2 mb-1" style="font-size: 0.8rem; display: none;"></div>

        <!-- Assistente NexaIA -->
        <div id="nexaia" class="mt-3"></div>

        <!-- Botão analisar com IA -->
        <button type="submit" class="btn-roxo mt-1">
          <i class="bi bi-stars me-2"></i> Analisar com IA
        </button>

      </form>

    </div>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="../js/config.js"></script>
  <script>
    if (typeof FIREBASE_CONFIG === "undefined") {
      document.write('<script src="../js/config.example.js"><\/script>');
    }
  </script>
  <script src="../js/firebase.js"></script>
  <script src="../js/nexaia.js"></script>

  <script>
    // NexaIA orienta o preenchimento
    nexaiaMostrar("nexaia",
      "Fale naturalmente — eu entendo o contexto. Se quiser, escreva um rascunho e toque em \"Melhorar descrição com IA\" que eu deixo o texto mais claro antes da análise.");

    // Exige login: se não estiver logado, volta para a tela inicial.
    // Se estiver, pré-preenche o nome e o contato com os dados da conta.
    auth.onAuthStateChanged(function (usuario) {
      if (!usuario) {
        window.location.href = "../index.html";
        return;
      }
      sessionStorage.setItem("nexatalk_usuario_id", usuario.uid);
      const campoNome = document.getElementById("nome");
      const campoContato = document.getElementById("contato");
      if (!campoNome.value) campoNome.value = usuario.displayName || "";
      if (!campoContato.value) campoContato.value = usuario.email || "";
    });

    // Contador de caracteres da descrição
    const descricao = document.getElementById("descricao");
    const contador = document.getElementById("contador");
    descricao.addEventListener("input", function () {
      contador.textContent = descricao.value.length;
    });

    // ===== Melhorar a descrição com a IA (Gemini, sob demanda) =====
    let descricaoOriginal = "";

    async function melhorarDescricao() {
      const texto = descricao.value.trim();
      const btn = document.getElementById("btnMelhorar");
      const msg = document.getElementById("msgMelhorar");
      msg.style.display = "none";

      if (texto.length < 10) {
        msg.textContent = "Escreva um pouco mais sobre o problema para eu conseguir melhorar o texto.";
        msg.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> A NexaIA está reescrevendo...';

      try {
        const melhorado = await nexaiaPerguntar(
          "Você é a NexaIA, assistente de atendimento da NexaTalk AI. " +
          "Reescreva a mensagem do cliente abaixo deixando-a mais clara, completa e educada para a triagem do atendimento. " +
          "Mantenha todas as informações citadas (números de pedido, valores, datas), escreva em primeira pessoa e NÃO invente dados. " +
          "Máximo de 500 caracteres. Responda APENAS com o texto reescrito, sem aspas.\n\n" +
          'Mensagem: "' + texto + '"'
        );
        descricaoOriginal = texto;
        descricao.value = melhorado.slice(0, 500);
        contador.textContent = descricao.value.length;
        msg.innerHTML = 'Texto aprimorado pela IA. <a href="#" onclick="desfazerMelhoria(); return false;" style="color: var(--roxo); font-weight: 600;">Desfazer</a>';
        msg.style.display = "block";
      } catch (e) {
        console.error(e);
        msg.textContent = "Não consegui melhorar agora (verifique a chave Gemini ou a cota do dia). Pode enviar do seu jeito!";
        msg.style.display = "block";
      }

      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-magic me-2"></i> Melhorar descrição com IA';
    }

    // Restaura o texto original digitado pelo cliente
    function desfazerMelhoria() {
      if (!descricaoOriginal) return;
      descricao.value = descricaoOriginal;
      contador.textContent = descricao.value.length;
      document.getElementById("msgMelhorar").style.display = "none";
    }

    let gravacao = null;

    async function gravarDescricao() {
      const btn = document.getElementById("btnVoz");
      const msg = document.getElementById("msgMelhorar");
      msg.style.display = "block";

      if (gravacao && gravacao.gravando) {
        gravacao.gravando = false;
        if (gravacao.timer) clearTimeout(gravacao.timer);
        gravacao.recorder.stop();
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        msg.textContent = "Este navegador não libera o microfone. Abra com Live Server no Edge ou Chrome.";
        return;
      }
      if (typeof MediaRecorder === "undefined") {
        msg.textContent = "Gravação de áudio indisponível neste navegador.";
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mime = nexaiaMimeAudio();
        const partes = [];
        const recorder = mime
          ? new MediaRecorder(stream, { mimeType: mime })
          : new MediaRecorder(stream);

        gravacao = { recorder: recorder, gravando: true, timer: null };

        recorder.ondataavailable = function (ev) {
          if (ev.data && ev.data.size > 0) partes.push(ev.data);
        };

        recorder.onstop = async function () {
          stream.getTracks().forEach(function (t) { t.stop(); });
          btn.disabled = true;
          btn.classList.remove("gravando");
          btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Transcrevendo com a NexaIA...';
          msg.textContent = "Enviando o áudio para a IA. Só um instante...";
          try {
            const blob = new Blob(partes, { type: recorder.mimeType || mime || "audio/webm" });
            if (blob.size < 800) {
              msg.textContent = "Áudio muito curto. Toque de novo, fale por alguns segundos e toque para parar.";
              return;
            }
            const texto = await nexaiaTranscreverAudio(blob);
            if (!texto || texto.indexOf("não entendi") >= 0) {
              msg.textContent = "Não entendi a fala. Fale mais perto do microfone e tente de novo.";
              return;
            }
            descricao.value = texto.slice(0, 500);
            descricao.classList.remove("is-invalid");
            contador.textContent = descricao.value.length;
            msg.textContent = "Pronto. Revise o texto e toque em Analisar com IA.";
          } catch (e) {
            console.error(e);
            msg.textContent = "Não consegui transcrever (microfone, chave Gemini ou cota). Tente de novo.";
          } finally {
            gravacao = null;
            btn.disabled = false;
            btn.classList.remove("gravando");
            btn.innerHTML = '<i class="bi bi-mic me-2"></i> Falar o problema (voz)';
          }
        };

        recorder.start();
        btn.classList.add("gravando");
        btn.innerHTML = '<i class="bi bi-stop-circle me-2"></i> Gravando... toque para parar';
        msg.textContent = "Fale agora. Toque de novo no botão para parar e eu coloco o texto no campo.";
        gravacao.timer = setTimeout(function () {
          if (gravacao && gravacao.gravando) {
            gravacao.gravando = false;
            recorder.stop();
          }
        }, 45000);
      } catch (e) {
        console.error(e);
        gravacao = null;
        btn.classList.remove("gravando");
        btn.innerHTML = '<i class="bi bi-mic me-2"></i> Falar o problema (voz)';
        msg.textContent = "Permita o microfone neste site (ícone ao lado da barra de endereço) e tente de novo.";
      }
    }

    async function reescreverDescricao(modo) {
      const texto = descricao.value.trim();
      const msg = document.getElementById("msgMelhorar");
      if (texto.length < 8) {
        msg.textContent = "Escreva ou grave um pouco mais primeiro.";
        msg.style.display = "block";
        return;
      }
      msg.style.display = "block";
      msg.textContent = "Reescrevendo...";
      try {
        descricaoOriginal = texto;
        descricao.value = (await nexaiaReescrever(texto, modo)).slice(0, 500);
        contador.textContent = descricao.value.length;
        msg.innerHTML = 'Pronto. <a href="#" onclick="desfazerMelhoria(); return false;" style="color: var(--roxo); font-weight: 600;">Desfazer</a>';
      } catch (e) {
        msg.textContent = "Não consegui reescrever agora (Gemini).";
      }
    }

    // Validação + envio do formulário
    const form = document.getElementById("formAtendimento");
    form.addEventListener("submit", function (evento) {
      evento.preventDefault();

      const nome = document.getElementById("nome").value.trim();
      const contato = document.getElementById("contato").value.trim();
      const texto = descricao.value.trim();

      // Marca os campos vazios como inválidos
      let valido = true;
      document.querySelectorAll("#formAtendimento [required]").forEach(function (campo) {
        if (campo.value.trim() === "") {
          campo.classList.add("is-invalid");
          valido = false;
        } else {
          campo.classList.remove("is-invalid");
        }
      });

      if (!valido) return;

      // Guarda os dados para a próxima tela (Análise da IA)
      sessionStorage.setItem("nexatalk_nome", nome);
      sessionStorage.setItem("nexatalk_contato", contato);
      sessionStorage.setItem("nexatalk_descricao", texto);

      window.location.href = "triagem-ia.html";
    });
  </script>
</body>
</html>
