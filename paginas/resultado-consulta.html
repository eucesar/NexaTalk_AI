<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexaTalk AI - Resultado da Consulta</title>

  <!-- Bootstrap 5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

  <div class="celular">

    <!-- Cabeçalho -->
    <div class="cabecalho">
      <a class="voltar" href="consultar-atendimento.html"><i class="bi bi-arrow-left"></i></a>
      <span class="titulo-topo">Resultado da Consulta</span>
    </div>

    <div class="corpo text-center">

      <span class="etiqueta-passo" style="background-color: rgba(248,113,113,0.12); border-color: rgba(248,113,113,0.35); color:#f87171;">PASSO 8 ✗ ERRO</span>

      <!-- Não encontrado (404) -->
      <div class="icone-erro-404"><i class="bi bi-x-lg"></i></div>
      <div class="numero-404">404</div>

      <h5 class="fw-bold mt-3 mb-2">Não encontramos esse atendimento</h5>
      <p class="text-secondary mb-3" style="font-size: 0.9rem;">
        Verifique o número do protocolo e tente novamente.
      </p>

      <!-- Assistente NexaIA -->
      <div id="nexaia"></div>

      <button class="btn-roxo mb-3" onclick="tentarNovamente()">
        <i class="bi bi-arrow-clockwise me-2"></i> Tentar Novamente
      </button>

      <button class="btn-roxo-claro" onclick="window.location.href='../index.html'">
        <i class="bi bi-house me-2"></i> Voltar ao Início
      </button>

    </div>
  </div>

  <script src="../js/nexaia.js"></script>
  <script>
    // Volta para a consulta mantendo o que foi digitado (?p=...&e=...)
    function tentarNovamente() {
      window.location.href = "consultar-atendimento.html" + window.location.search;
    }

    // NexaIA analisa o que foi digitado e sugere a correção
    const parametros = new URLSearchParams(window.location.search);
    const protocoloDigitado = (parametros.get("p") || "").trim();
    const emailDigitado = (parametros.get("e") || "").trim();

    let dica;
    const formatoOk = /^#?ATD-\d{4}-\d{5}$/i.test(protocoloDigitado.replace(/\s+/g, ""));

    if (protocoloDigitado && !formatoOk) {
      dica = 'O protocolo "' + protocoloDigitado + '" não está no formato ATD-ANO-NÚMERO (ex: ATD-2026-00847). Confira se não faltou o começo "ATD-" ou algum dígito.';
    } else if (protocoloDigitado) {
      dica = "O formato do protocolo está certo, mas não achei ele no banco. Confira os números ou tente buscar pelo e-mail usado na abertura do atendimento.";
    } else if (emailDigitado) {
      dica = 'Não encontrei atendimentos para "' + emailDigitado + '". Verifique se foi esse mesmo o e-mail informado ao abrir o atendimento.';
    } else {
      dica = "Informe o número do protocolo ou o e-mail cadastrado para eu localizar seu atendimento.";
    }
    nexaiaMostrar("nexaia", dica);
  </script>
</body>
</html>
