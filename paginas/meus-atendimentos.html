<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexaTalk AI - Meus Atendimentos</title>

  <!-- Bootstrap 5.3.8 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

  <div class="celular">

    <!-- Cabeçalho -->
    <div class="cabecalho">
      <a class="voltar" href="../index.html"><i class="bi bi-arrow-left"></i></a>
      <span class="titulo-topo">Meus Atendimentos</span>
      <a class="acao-topo" href="consultar-atendimento.html" title="Consultar por protocolo ou e-mail"><i class="bi bi-search"></i></a>
    </div>

    <div class="corpo">

      <span class="etiqueta-passo">PASSO 5</span>

      <!-- Busca -->
      <div class="position-relative mb-3">
        <input id="busca" type="text" class="form-control" placeholder="Buscar por protocolo ou descrição...">
      </div>

      <!-- Filtros -->
      <div class="filtros">
        <span class="pill ativo" data-filtro="todos" onclick="selecionarFiltro(this)">Todos</span>
        <span class="pill" data-filtro="análise" onclick="selecionarFiltro(this)">Em análise</span>
        <span class="pill" data-filtro="concluído" onclick="selecionarFiltro(this)">Concluído</span>
      </div>

      <!-- Assistente NexaIA -->
      <div id="nexaia"></div>

      <!-- Carregando -->
      <div id="carregando" class="carregando-ia">
        <div class="spinner-border mb-2" role="status" style="color: var(--roxo);">
          <span class="visually-hidden">Carregando...</span>
        </div>
        <p class="text-secondary">Carregando seus atendimentos...</p>
      </div>

      <!-- Lista -->
      <div id="lista"></div>

      <!-- Vazio -->
      <div id="vazio" class="text-center text-secondary" style="display: none; padding: 30px 10px;">
        <i class="bi bi-inbox" style="font-size: 2.2rem;"></i>
        <p class="mt-2 mb-0">Nenhum atendimento encontrado.</p>
      </div>

      <!-- Feedback da exclusão -->
      <div id="msgApagar" class="text-center mb-2" style="font-size: 0.85rem; display: none;"></div>

      <!-- Apagar finalizados (Resolvido pela IA + Concluído pelo operador) -->
      <button id="btnApagarFinalizados" class="btn-apagar mb-2" onclick="apagarFinalizados()">
        <i class="bi bi-trash me-2"></i> Apagar atendimentos concluídos
      </button>

      <!-- Novo atendimento -->
      <button class="btn-roxo mt-2" onclick="window.location.href='novo-atendimento.html'">
        <i class="bi bi-plus-circle me-2"></i> Abrir Novo Atendimento
      </button>

    </div>
  </div>

  <!-- Popup de confirmação (no app, sem alert do navegador) -->
  <div class="modal fade modal-nexatalk" id="modalApagar" tabindex="-1" aria-labelledby="modalApagarTitulo" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-body text-center p-4 pb-2">
          <div class="icone-modal-apagar mb-3">
            <i class="bi bi-trash"></i>
          </div>
          <h5 class="mb-2" id="modalApagarTitulo">Apagar atendimentos?</h5>
          <p id="modalApagarTexto" class="text-secondary mb-0" style="font-size: 0.9rem;"></p>
        </div>
        <div class="modal-footer border-0 pt-0 px-4 pb-4 flex-column gap-2">
          <button type="button" class="btn-apagar-modal" id="btnModalConfirmarApagar">
            Sim, apagar
          </button>
          <button type="button" class="btn-roxo-claro" data-bs-dismiss="modal">
            Cancelar
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="../js/config.js"></script>
  <script>
    if (typeof FIREBASE_CONFIG === "undefined") {
      document.write('<script src="../js/config.example.js"><\/script>');
    }
  </script>
  <script src="../js/firebase.js"></script>
  <script src="../js/nexaia.js"></script>

  <script>
    let todosAtendimentos = [];   // tudo que veio do banco
    let filtroAtual = "todos";
    let usuarioAtual = null;
    let modalApagar = null;
    let qtdParaApagar = 0;

    // Modal Bootstrap (popup dentro do app)
    modalApagar = new bootstrap.Modal(document.getElementById("modalApagar"));
    document.getElementById("btnModalConfirmarApagar").addEventListener("click", executarApagarFinalizados);

    // Exige login
    auth.onAuthStateChanged(async function (usuario) {
      if (!usuario) {
        window.location.href = "../index.html";
        return;
      }
      usuarioAtual = usuario;
      try {
        todosAtendimentos = await listarMeusAtendimentos(usuario.uid);
        renderizar();
        montarResumoNexaia(usuario);
      } catch (e) {
        console.error(e);
        document.getElementById("carregando").innerHTML =
          '<p class="text-danger">Não foi possível carregar seus atendimentos.</p>';
      }
    });

    // NexaIA resume a situação dos atendimentos (contagem local)
    function montarResumoNexaia(usuario) {
      const nome = nexaiaPrimeiroNome(usuario.displayName || "");
      const saudacao = nexaiaSaudacao() + (nome ? ", " + nome : "") + "! ";

      if (todosAtendimentos.length === 0) {
        nexaiaMostrar("nexaia", saudacao +
          "Você ainda não tem atendimentos. Toque em Abrir Novo Atendimento que eu faço a triagem para você.");
        return;
      }

      const finalizados = todosAtendimentos.filter(function (a) {
        return atendimentoFinalizadoParaCliente(a.status);
      }).length;
      const emAndamento = todosAtendimentos.length - finalizados;

      nexaiaMostrar("nexaia",
        saudacao + "Você tem " + todosAtendimentos.length + " atendimento(s): " +
        emAndamento + " em andamento e " + finalizados + " finalizado(s). Toque em um card para ver os detalhes.",
        { acaoTexto: "✨ Resumir com IA", aoClicar: resumirComIA });
    }

    // Resumo inteligente sob demanda (Gemini)
    async function resumirComIA() {
      const btn = document.getElementById("nexaiaAcao");
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Resumindo...';

      try {
        const linhas = todosAtendimentos.slice(0, 10).map(function (a) {
          const assunto = ((a.ia && a.ia.resumo) || a.descricao_original || "").slice(0, 120);
          return "- " + (a.protocolo || "?") + " | status: " + (a.status || "?") + " | assunto: " + assunto;
        }).join("\n");

        const resumo = await nexaiaPerguntar(
          "Você é a NexaIA, assistente da NexaTalk AI. Resuma para o cliente, em no máximo 2 frases simpáticas em português, " +
          "a situação geral dos atendimentos dele (o que está andando, o que já foi resolvido e se algo precisa de atenção). " +
          "Responda apenas com o resumo, sem listas.\n\nAtendimentos:\n" + linhas
        );
        nexaiaTexto("nexaia", resumo);
        btn.style.display = "none";
      } catch (e) {
        console.error(e);
        btn.disabled = false;
        btn.innerHTML = "✨ Resumir com IA";
        nexaiaTexto("nexaia", "Não consegui gerar o resumo agora (verifique a chave Gemini ou a cota do dia). Tente novamente mais tarde.");
      }
    }

    // Monta o selo de status conforme o texto
    function badgeStatus(status) {
      const s = (status || "").toLowerCase();
      if (s.includes("conclu")) return '<span class="status-badge status-concluido"><i class="bi bi-check-circle"></i> Concluído</span>';
      if (s.includes("resolvido")) return '<span class="status-badge status-ia"><i class="bi bi-robot"></i> Resolvido pela IA</span>';
      if (s.includes("recebido")) return '<span class="status-badge status-recebido"><i class="bi bi-inbox"></i> Recebido</span>';
      return '<span class="status-badge status-analise"><i class="bi bi-arrow-repeat"></i> Em análise</span>';
    }

    // Seleciona o filtro clicado
    function selecionarFiltro(elemento) {
      document.querySelectorAll(".pill").forEach(function (p) { p.classList.remove("ativo"); });
      elemento.classList.add("ativo");
      filtroAtual = elemento.getAttribute("data-filtro");
      renderizar();
    }

    // Aplica filtro + busca e mostra a lista
    function renderizar() {
      document.getElementById("carregando").style.display = "none";
      const termo = document.getElementById("busca").value.toLowerCase().trim();

      const filtrados = todosAtendimentos.filter(function (a) {
        const status = (a.status || "").toLowerCase();
        const passaFiltro = filtroAtual === "todos" || status.includes(filtroAtual);
        const texto = ((a.protocolo || "") + " " + (a.descricao_original || "")).toLowerCase();
        const passaBusca = termo === "" || texto.includes(termo);
        return passaFiltro && passaBusca;
      });

      const lista = document.getElementById("lista");
      const vazio = document.getElementById("vazio");
      lista.innerHTML = "";

      if (filtrados.length === 0) {
        vazio.style.display = "block";
        return;
      }
      vazio.style.display = "none";

      filtrados.forEach(function (a) {
        const card = document.createElement("div");
        card.className = "card-atendimento";
        card.innerHTML =
          '<div class="d-flex justify-content-between align-items-center mb-1">' +
            '<span class="protocolo">' + (a.protocolo || "—") + "</span>" +
            badgeStatus(a.status) +
          "</div>" +
          '<div class="text-secondary" style="font-size:0.9rem;">' + (a.descricao_original || "") + "</div>" +
          '<div class="text-secondary mt-1" style="font-size:0.78rem;"><i class="bi bi-clock"></i> ' + (a.data_criacao || "") + "</div>";

        // Ao clicar, abre a tela de detalhes do atendimento (PASSO 6)
        card.addEventListener("click", function () {
          window.location.href = "detalhe-atendimento.html?id=" + a.id;
        });

        lista.appendChild(card);
      });
    }

    // Busca em tempo real
    document.getElementById("busca").addEventListener("input", renderizar);

    // Abre popup perguntando se quer apagar finalizados
    function apagarFinalizados() {
      if (!usuarioAtual) return;

      qtdParaApagar = todosAtendimentos.filter(function (a) {
        return atendimentoFinalizadoParaCliente(a.status);
      }).length;

      if (qtdParaApagar === 0) {
        mostrarMsgApagar("Nenhum atendimento concluído para apagar (Resolvido pela IA ou Concluído).", "#a29db8");
        return;
      }

      document.getElementById("modalApagarTexto").textContent =
        "Serão apagados " + qtdParaApagar +
        ' atendimento(s) finalizados ("Resolvido pela IA" ou "Concluído" após resposta do operador). Remove do banco e não pode ser desfeita.';
      modalApagar.show();
    }

    // Confirma no popup e apaga no Firestore
    async function executarApagarFinalizados() {
      modalApagar.hide();

      const btn = document.getElementById("btnApagarFinalizados");
      const btnModal = document.getElementById("btnModalConfirmarApagar");
      btn.disabled = true;
      btnModal.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Apagando...';

      try {
        const apagados = await apagarAtendimentosFinalizados(usuarioAtual.uid);
        todosAtendimentos = await listarMeusAtendimentos(usuarioAtual.uid);
        renderizar();
        montarResumoNexaia(usuarioAtual);
        mostrarMsgApagar(apagados + " atendimento(s) concluído(s) apagado(s) do banco.", "#4ade80");
      } catch (e) {
        console.error(e);
        mostrarMsgApagar("Não foi possível apagar. Tente novamente.", "#f87171");
      }

      btn.disabled = false;
      btnModal.disabled = false;
      btn.innerHTML = '<i class="bi bi-trash me-2"></i> Apagar atendimentos concluídos';
    }

    function mostrarMsgApagar(texto, cor) {
      const el = document.getElementById("msgApagar");
      el.style.display = "block";
      el.style.color = cor;
      el.textContent = texto;
    }
  </script>
</body>
</html>
